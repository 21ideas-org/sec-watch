name: pr

# Тяжёлые проверки живут здесь, а не в деплое: код правится руками только
# через PR, а в автоматической публикации поста они проверяли бы то,
# что не менялось, и стоили бы минут ожидания у читателя.
on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
